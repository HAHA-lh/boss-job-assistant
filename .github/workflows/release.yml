name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Verify tag matches manifest version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${VERSION}"
      - name: Package extension
        shell: bash
        run: |
          cd dist
          zip -r "../boss-job-assistant-extension-${GITHUB_REF_NAME}.zip" .
          cd ..
          sha256sum "boss-job-assistant-extension-${GITHUB_REF_NAME}.zip" > "boss-job-assistant-extension-${GITHUB_REF_NAME}.zip.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "boss-job-assistant-extension-${GITHUB_REF_NAME}.zip" \
            "boss-job-assistant-extension-${GITHUB_REF_NAME}.zip.sha256" \
            --generate-notes \
            --title "求职匹配助手 ${GITHUB_REF_NAME}"
