name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run ci
      - uses: actions/upload-artifact@v4
        with:
          name: boss-job-assistant-extension-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
